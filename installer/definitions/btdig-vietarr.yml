# Managed by VietArr
---
id: btdig-vietarr
name: BTDig (VietArr)
description: "BTDig is a public DHT torrent search engine. It exposes magnet links but not verified seed or peer counts."
language: en-US
type: public
encoding: UTF-8
links:
  - https://btdig.com/

caps:
  categorymappings:
    - {id: General, cat: Movies, desc: Movies}
    - {id: General, cat: TV, desc: TV}
    - {id: General, cat: Other, desc: Other}

  modes:
    search: [q]
    tv-search: [q, season, ep]
    movie-search: [q]

settings: []

download:
  infohash:
    hash:
      selector: a[href^="magnet:?xt=urn:btih:"]
      attribute: href
      filters:
        - name: regexp
          args: "urn:btih:([A-Fa-f0-9]{40})"
    title:
      selector: div.torrent_name > a

search:
  paths:
    - path: search
  inputs:
    q: "{{ if .Keywords }}{{ .Keywords }}{{ else }}{{ .Today.Year }}{{ end }}"
    order: 0

  rows:
    selector: div.one_result
    filters:
      - name: andmatch

  fields:
    category:
      text: General
    title:
      selector: div.torrent_name > a
    details:
      selector: div.torrent_name > a
      attribute: href
    download:
      selector: div.torrent_magnet a[href^="magnet:?xt=urn:btih:"]
      attribute: href
    infohash:
      selector: div.torrent_magnet a[href^="magnet:?xt=urn:btih:"]
      attribute: href
      filters:
        - name: regexp
          args: "urn:btih:([A-Fa-f0-9]{40})"
    date:
      text: now
    size:
      selector: span.torrent_size
    # BTDig does not publish live swarm counts. Cardigann requires numeric
    # availability fields, so use the same neutral sentinel as comparable
    # public DHT definitions instead of claiming measured availability.
    seeders:
      text: 1
    leechers:
      text: 1
    downloadvolumefactor:
      text: 0
    uploadvolumefactor:
      text: 1
# engine n/a
